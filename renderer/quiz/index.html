<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>concierge-quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="card">
      <button id="close" title="閉じる">×</button>
      <div id="question"></div>
      <div id="text"></div>
      <ul id="sources" class="hidden"></ul>
      <div id="actions">
        <button id="remembered" class="ghost">覚えてる!</button>
        <button id="forgot" class="ghost">覚えてない…</button>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
